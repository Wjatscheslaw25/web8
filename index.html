<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание №8 (Юрьев Вячеслав, ПИ-21-1)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка страницы -->
    <header class="site-header">
        <div class="header-container">
            <span>Задание №8</span>
            <span>Юрьев Вячеслав</span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="page-content">
        <div class="content-card">
            <h2>Обратная связь</h2>
            <p>Нажмите кнопку ниже, чтобы открыть форму обратной связи.</p>
            <button id="open-popup-btn" class="primary-btn">Связаться с нами</button>
        </div>
    </main>

    <!-- Попап (модальное окно) с формой -->
    <div id="popup-overlay" class="popup-overlay">
        <div class="popup-window">
            <button id="close-popup-btn" class="close-btn">&times;</button>
            <h3>Форма обратной связи</h3>
            
            <form id="feedback-form">
                <div class="form-group">
                    <label for="fullname">ФИО *</label>
                    <!-- Только русские или латинские буквы и пробелы -->
                    <input type="text" id="fullname" name="fullname" required 
                           pattern="^[А-Яа-яЁёA-Za-z\s]+$" 
                           title="ФИО должно содержать только буквы и пробелы">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон *</label>
                    <!-- Только цифры, знак плюс, скобки, дефисы и пробелы -->
                    <input type="tel" id="phone" name="phone" required 
                           pattern="^[\+]?[\d\s\-\(\)]+$" 
                           title="Введите корректный номер телефона (допускаются цифры, +, пробелы, дефисы)">
                </div>

                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input type="text" id="organization" name="organization">
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="agreement" name="agreement" required>
                        Согласен с политикой обработки персональных данных
                    </label>
                </div>

                <button type="submit" id="submit-btn" class="primary-btn">Отправить</button>
            </form>

            <!-- Блок для вывода статуса отправки -->
            <div id="form-status" class="form-status"></div>
        </div>
    </div>

    <script src="my.js"></script>
</body>
</html>
